<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Livro de Contas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#26261F">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Spectral:ital@1&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --paper: #ECE6D8; --paper-alt: #F6F1E6; --ink: #26261F; --ink-soft: #5B5A4E;
    --line: #C9BFA8; --line-strong: #A79C81; --forest: #2F5233; --forest-soft: #E4EBE1;
    --rust: #9C4A3E; --rust-soft: #F1E2DE; --gold: #A8752E; --gold-soft: #F1E5CC;
    --serif: 'Spectral', Georgia, serif; --sans: 'IBM Plex Sans', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { font-family: var(--sans); color: var(--ink); }
  .sheet { max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; background: var(--paper); min-height: 100vh; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 6px; }
  .masthead h1 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 0; letter-spacing: 0.2px; }
  .masthead .subt { font-size: 12px; color: var(--ink-soft); font-style: italic; font-family: var(--serif); }

  .setup-wrap, .lock-wrap { max-width: 460px; margin: 40px auto; padding: 0 20px; }
  .setup-title { font-family: var(--serif); font-size: 24px; font-weight: 600; margin-bottom: 6px; }
  .setup-sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 22px; line-height: 1.5; }
  .setup-field { margin-bottom: 14px; }
  .setup-field label { display: block; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 5px; }
  .setup-error { background: var(--rust-soft); color: var(--rust); border: 1px solid var(--rust); padding: 10px 12px; font-size: 13px; margin-bottom: 14px; display: none; }
  .setup-error.show { display: block; }
  .lock-pin { font-size: 28px; letter-spacing: 10px; text-align: center; }
  .lock-skip { text-align: center; font-size: 12px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; margin-top: 14px; }

  .tabs { display: flex; gap: 2px; margin: 18px 0 22px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; min-width: 62px; text-align: center; padding: 9px 8px; background: var(--paper-alt); border: 1px solid var(--line); border-bottom: none; font-size: 12.5px; font-family: var(--sans); font-weight: 500; color: var(--ink-soft); cursor: pointer; user-select: none; white-space: nowrap; }
  .tab.active { background: var(--ink); color: var(--paper-alt); border-color: var(--ink); }

  .hero { border: 1px solid var(--line-strong); background: var(--paper-alt); padding: 22px 20px; margin-bottom: 26px; }
  .hero-row { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px; }
  .hero-num { font-family: var(--serif); font-size: 40px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .hero-num.neg { color: var(--rust); }
  .hero-num.pos { color: var(--forest); }
  .hero-label { font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
  .hero-plan { text-align: right; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .hero-plan strong { display: block; font-family: var(--serif); font-size: 17px; color: var(--ink); font-weight: 600; }
  .diff-note { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line-strong); font-size: 12.5px; color: var(--ink-soft); }
  .diff-note b { color: var(--ink); }

  .goal-box { border: 1px solid var(--line-strong); background: var(--gold-soft); padding: 16px 18px; margin-bottom: 26px; }
  .goal-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .goal-title { font-family: var(--serif); font-weight: 600; font-size: 15px; }
  .goal-deadline { font-size: 11.5px; color: var(--ink-soft); font-style: italic; }
  .goal-bar-track { width: 100%; height: 10px; background: var(--paper-alt); border: 1px solid var(--line-strong); overflow: hidden; margin-bottom: 8px; }
  .goal-bar-fill { height: 100%; background: var(--gold); }
  .goal-numbers { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-soft); }
  .goal-numbers b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .proj-box { border: 1px solid var(--line-strong); background: var(--paper-alt); padding: 16px 18px; margin-bottom: 26px; }
  .proj-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .proj-result { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-strong); font-family: var(--serif); font-size: 16px; font-weight: 600; }
  .proj-result.neg { color: var(--rust); }
  .proj-result.pos { color: var(--forest); }
  .bill-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .bill-left { display: flex; flex-direction: column; }
  .bill-meta { font-size: 11.5px; color: var(--ink-soft); }
  .bill-pay-btn { font-size: 11.5px; padding: 5px 10px; background: var(--forest-soft); color: var(--forest); border: 1px solid var(--forest); cursor: pointer; font-family: var(--sans); }

  .debt-total-box { border: 1px solid var(--rust); background: var(--rust-soft); padding: 14px 18px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .debt-total-num { font-family: var(--serif); font-size: 26px; font-weight: 600; color: var(--rust); font-variant-numeric: tabular-nums; }
  .debt-total-label { font-size: 12px; color: var(--ink-soft); }

  section { margin-bottom: 30px; }
  .section-title { font-family: var(--serif); font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--ink); padding-bottom: 6px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }

  .due-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .due-name { font-weight: 500; }
  .due-days { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12.5px; }
  .due-days.soon { color: var(--rust); }
  .due-days.ok { color: var(--ink-soft); }

  .chart-wrap { display: flex; align-items: flex-end; gap: 6px; height: 110px; padding: 10px 0 4px; border-bottom: 1px solid var(--line-strong); }
  .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart-bar { width: 70%; min-height: 2px; }
  .chart-bar.pos { background: var(--forest); }
  .chart-bar.neg { background: var(--rust); }
  .chart-labels { display: flex; gap: 6px; margin-top: 6px; }
  .chart-labels span { flex: 1; text-align: center; font-size: 10.5px; color: var(--ink-soft); }

  .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
  .cat-bar-track { flex: 1; height: 6px; background: var(--paper-alt); margin: 0 10px; border: 1px solid var(--line); overflow: hidden; }
  .cat-bar-fill { height: 100%; background: var(--gold); }

  .form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .form-row.two > * { flex: 1; min-width: 130px; }

  input, select {
    font-family: var(--sans); font-size: 14px; padding: 9px 10px;
    border: 1px solid var(--line-strong); background: var(--paper-alt); color: var(--ink); width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--forest); }

  .toggle-group { display: flex; border: 1px solid var(--line-strong); overflow: hidden; }
  .toggle-opt { flex: 1; text-align: center; padding: 9px 4px; font-size: 13px; cursor: pointer; background: var(--paper-alt); color: var(--ink-soft); }
  .toggle-opt.sel-in { background: var(--forest); color: #fff; }
  .toggle-opt.sel-out { background: var(--rust); color: #fff; }

  button.add-btn, button.setup-btn, button.action-btn {
    width: 100%; padding: 11px; background: var(--ink); color: var(--paper-alt); border: none;
    font-family: var(--sans); font-weight: 500; font-size: 14px; cursor: pointer; margin-top: 4px;
  }
  button.add-btn:active, button.setup-btn:active, button.action-btn:active { opacity: 0.85; }
  button.action-btn.secondary { background: var(--paper-alt); color: var(--ink); border: 1px solid var(--line-strong); }
  .cancel-edit { text-align: center; font-size: 12px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; margin-top: 8px; }

  .entry-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; gap: 8px; }
  .entry-left { display: flex; flex-direction: column; }
  .entry-cat { color: var(--ink-soft); font-size: 11.5px; }
  .entry-val { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .entry-val.in { color: var(--forest); }
  .entry-val.out { color: var(--rust); }
  .entry-actions { display: flex; align-items: center; gap: 8px; }
  .entry-edit, .entry-del { cursor: pointer; color: var(--ink-soft); font-size: 12px; }

  .empty-note { font-size: 13px; color: var(--ink-soft); font-style: italic; padding: 10px 0; }

  .debt-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .debt-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .debt-name { font-weight: 600; font-size: 14px; }
  .debt-meta { font-size: 12px; color: var(--ink-soft); }
  .debt-status { font-size: 11.5px; padding: 3px 9px; border-radius: 2px; font-weight: 500; white-space: nowrap; }
  .status-quitado { background: var(--forest-soft); color: var(--forest); }
  .status-ativo { background: var(--gold-soft); color: var(--gold); }
  .status-atencao { background: var(--rust-soft); color: var(--rust); }
  .debt-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; flex-wrap: wrap; gap: 8px; }
  .debt-check { font-size: 12px; color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .debt-check input { width: 14px; height: 14px; padding: 0; }
  .quick-btn { font-size: 11.5px; padding: 5px 10px; background: var(--forest-soft); color: var(--forest); border: 1px solid var(--forest); cursor: pointer; font-family: var(--sans); }

  .export-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .export-row button { flex: 1; min-width: 150px; }
  .export-note { font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; }
  .copy-confirm { font-size: 12px; color: var(--forest); margin-top: 8px; display: none; }
  .copy-confirm.show { display: block; }

  footer { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 34px; font-style: italic; font-family: var(--serif); }
  .reset-link, .switch-link, .pin-link { text-align: center; font-size: 11px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; margin-top: 6px; }

  .save-error { background: var(--rust-soft); color: var(--rust); border: 1px solid var(--rust); padding: 10px 14px; font-size: 13px; margin: 14px 0; display: none; }
  .save-error.show { display: block; }

  .sync-badge { font-size: 11px; color: var(--forest); display: flex; align-items: center; gap: 5px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--forest); display: inline-block; }
  .sync-dot.busy { background: var(--gold); }

  .fab { position: fixed; bottom: 22px; right: 22px; width: 54px; height: 54px; border-radius: 50%; background: var(--ink); color: var(--paper-alt); font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.3); z-index: 50; border: none; }

  .loading { text-align: center; padding: 40px 0; color: var(--ink-soft); font-family: var(--serif); font-style: italic; }
</style>
</head>
<body>
<div class="sheet" id="app">
  <div class="loading">Abrindo o livro de contas…</div>
</div>

<script>
const START_YEAR = 2026, START_MONTH = 9; // Set/2026 — mês atual
const MONTH_ABBR = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function generateMonthDefs() {
  const now = new Date();
  const minEnd = new Date(2027, 11, 1);
  const rollingEnd = new Date(now.getFullYear(), now.getMonth() + 6, 1);
  const end = rollingEnd > minEnd ? rollingEnd : minEnd;
  const defs = [];
  let y = START_YEAR, mo = START_MONTH;
  while (y < end.getFullYear() || (y === end.getFullYear() && mo <= end.getMonth() + 1)) {
    const key = y + '-' + String(mo).padStart(2, '0');
    const label = MONTH_ABBR[mo - 1] + '/' + String(y).slice(2);
    defs.push([key, label]);
    mo++;
    if (mo > 12) { mo = 1; y++; }
  }
  return defs;
}

const MONTH_DEFS = generateMonthDefs();
const MONTHS = MONTH_DEFS.map(d => d[0]);
const MONTH_LABELS = Object.fromEntries(MONTH_DEFS);
const OLD_KEY_MAP = { out: '2026-10', nov: '2026-11', dez: '2026-12', jan: '2027-01' };

const PLAN_TARGET = { '2026-10': 587.00, '2026-11': 305.19, '2026-12': 2181.04, '2027-01': 2739.54 };
const PLAN_NOTE = {
  '2026-10': 'Quita Empréstimo 1 (R$1.719,63) e rola a fatura pra novembro.',
  '2026-11': 'Paga a fatura rolada (R$2.001,44) e a última parcela da 99.',
  '2026-12': '99 já livre; quita o Empréstimo 2 (~R$558,50).',
  '2027-01': 'Só restam Bianca (R$200) e Noverde (R$260,46).'
};

function monthIndex(m) { return MONTHS.indexOf(m); }
function monthsSinceOct2026(m) {
  const [y, mo] = m.split('-').map(Number);
  return (y - 2026) * 12 + (mo - 10);
}
function biancaForMonth(m) { const i = monthsSinceOct2026(m); if (i < 0) return 0; if (i <= 3) return 200; if (i >= 4 && i <= 8) return 60; return 0; }
function noverdeForMonth(m) { const i = monthsSinceOct2026(m); if (i < 0) return 0; return i <= 10 ? 260.46 : 0; }
function fixedObrigacoes(m) { return biancaForMonth(m) + noverdeForMonth(m); }

// dueDay: dia do mês do vencimento (aproximado p/ Bianca)
const DEBTS = [
  { id: 'bianca', name: 'Bianca', meta: 'R$200/mês até jan · cai pra R$60 em fev', kind: 'ongoing', dueDay: 8, quickCat: 'Dívida fixa', quickVal: (m) => biancaForMonth(m) },
  { id: 'emp1', name: 'Nubank — Empréstimo 1', meta: 'Quitação R$1.719,63', kind: 'checkable', quickCat: 'Dívida fixa', quickVal: () => 1719.63 },
  { id: 'fatura', name: 'Nubank — Fatura', meta: 'Rolada de out. pra nov. (R$2.001,44)', kind: 'ongoing', dueDay: 14, quickCat: 'Dívida fixa', quickVal: () => 2001.44 },
  { id: 'emp2', name: 'Nubank — Empréstimo 2', meta: 'Quitação ~R$558,50 (confirmar no app)', kind: 'checkable', dueDay: 5, quickCat: 'Dívida fixa', quickVal: () => 558.50 },
  { id: 'noverde', name: 'Noverde — Empréstimo 3', meta: 'Sem resposta — tentar consumidor.gov.br', kind: 'checkable', label: 'Consegui contato', dueDay: 26, quickCat: 'Dívida fixa', quickVal: () => 260.46 },
  { id: 'nov99', name: '99 — Empréstimo 4', meta: 'Última parcela R$318,69', kind: 'checkable', dueDay: 10, quickCat: 'Dívida fixa', quickVal: () => 318.69 },
];

function biancaAtOffset(o) { if (o < 0) return 0; if (o <= 3) return 200; if (o <= 8) return 60; return 0; }
function noverdeAtOffset(o) { if (o < 0) return 0; return o <= 10 ? 260.46 : 0; }
function sumFromOffset(fn, fromOffset) { let s = 0; for (let o = Math.max(fromOffset, 0); o <= 15; o++) s += fn(o); return s; }

function totalDebtRemaining() {
  const ci = monthsSinceOct2026(state.currentMonth);
  let total = sumFromOffset(biancaAtOffset, ci) + sumFromOffset(noverdeAtOffset, ci);
  DEBTS.filter(d => d.kind === 'checkable' && d.id !== 'noverde').forEach(d => { if (!state.debtStatus[d.id]) total += d.quickVal(state.currentMonth); });
  state.customDebts.forEach(d => { if (d.kind === 'checkable' && !state.debtStatus[d.id]) total += d.valor; });
  return total;
}

function allDebts() {
  const custom = state.customDebts.map(c => ({
    id: c.id, name: c.name, meta: c.meta, kind: c.kind, dueDay: c.dueDay,
    custom: true, quickCat: 'Dívida fixa', quickVal: () => c.valor
  }));
  return [...DEBTS, ...custom];
}

const DEFAULT_GOAL = { id: 'meta-20k', name: 'Guardar R$ 20.000', target: 20000, deadline: 'dezembro de 2027' };
const CONFIG_KEY = 'kayo-financas-config';
const PIN_KEY = 'kayo-financas-pin';
const TABLE = 'financas';

let cfg = null;
let sb = null;
let state = { entries: [], debtStatus: {}, customDebts: [], goals: [], categoryBudgets: {}, plannedBills: [], customCategories: [], currentMonth: MONTHS[0] };
let saveError = false;
let syncing = false;
let copyConfirmVisible = false;
let selType = 'in';
let editingId = null;
let unlocked = false;

function fmt(n) {
  const neg = n < 0;
  const v = Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (neg ? '-' : '') + 'R$ ' + v;
}

function loadConfig() {
  try { const raw = localStorage.getItem(CONFIG_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function saveConfig(c) { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); }
function getPin() { try { return localStorage.getItem(PIN_KEY); } catch (e) { return null; } }
function setPin(p) { if (p) localStorage.setItem(PIN_KEY, p); else localStorage.removeItem(PIN_KEY); }

// ---------- PIN lock ----------
function renderLock(errorMsg) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="lock-wrap">
      <div class="setup-title">Livro de Contas</div>
      <div class="setup-sub">Digite seu PIN pra abrir.</div>
      <div class="setup-error ${errorMsg ? 'show' : ''}">${errorMsg || ''}</div>
      <div class="setup-field">
        <input type="password" maxlength="20" id="pin-input" class="lock-pin" placeholder="••••" style="letter-spacing:6px; font-size:22px;">
      </div>
      <button class="setup-btn" id="btn-unlock">Entrar</button>
    </div>
  `;
  const pinInput = document.getElementById('pin-input');
  pinInput.focus();
  const tryUnlock = () => {
    if (pinInput.value === getPin()) { unlocked = true; boot(); }
    else renderLock('PIN incorreto, tenta de novo.');
  };
  document.getElementById('btn-unlock').addEventListener('click', tryUnlock);
  pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
}

// ---------- Setup (Supabase config) ----------
function renderSetup(errorMsg) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="setup-wrap">
      <div class="setup-title">Livro de Contas</div>
      <div class="setup-sub">Conecte com o seu projeto Supabase pra sincronizar entre aparelhos. Cole as informações que você copiou lá.</div>
      <div class="setup-error ${errorMsg ? 'show' : ''}">${errorMsg || ''}</div>
      <div class="setup-field"><label>Project URL</label><input type="text" id="cfg-url" placeholder="https://xxxxx.supabase.co" value="${cfg && cfg.url ? cfg.url : ''}"></div>
      <div class="setup-field"><label>Chave anon public</label><input type="text" id="cfg-key" placeholder="eyJhbGciOi..." value="${cfg && cfg.key ? cfg.key : ''}"></div>
      <div class="setup-field"><label>Seu código de acesso pessoal</label><input type="text" id="cfg-code" placeholder="ex: kayo-financas-2026" value="${cfg && cfg.code ? cfg.code : ''}"></div>
      <button class="setup-btn" id="btn-setup">Conectar</button>
    </div>
  `;
  document.getElementById('btn-setup').addEventListener('click', async () => {
    const url = document.getElementById('cfg-url').value.trim();
    const key = document.getElementById('cfg-key').value.trim();
    const code = document.getElementById('cfg-code').value.trim();
    if (!url || !key || !code) { renderSetup('Preenche os três campos pra continuar.'); return; }
    try {
      const testClient = window.supabase.createClient(url, key);
      const { error } = await testClient.from(TABLE).select('id').eq('id', code).maybeSingle();
      if (error && error.code !== 'PGRST116') throw error;
      cfg = { url, key, code };
      saveConfig(cfg);
      sb = testClient;
      await loadData();
    } catch (e) {
      renderSetup('Não consegui conectar. Confere se a URL, a chave e se o script SQL foram rodados certinho. Detalhe técnico: ' + (e.message || e));
    }
  });
}

async function loadData() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Sincronizando com a nuvem…</div>';
  try {
    const { data, error } = await sb.from(TABLE).select('payload').eq('id', cfg.code).maybeSingle();
    if (error) throw error;
    if (data && data.payload) {
      state.entries = (data.payload.entries || []).map(e => ({ ...e, month: OLD_KEY_MAP[e.month] || e.month }));
      state.debtStatus = data.payload.debtStatus || {};
      state.customDebts = data.payload.customDebts || [];
      state.goals = data.payload.goals && data.payload.goals.length ? data.payload.goals : [DEFAULT_GOAL];
      state.categoryBudgets = data.payload.categoryBudgets || {};
      state.plannedBills = data.payload.plannedBills || [];
      state.customCategories = data.payload.customCategories || [];
    } else {
      state.goals = [DEFAULT_GOAL];
      await sb.from(TABLE).insert({ id: cfg.code, payload: { entries: [], debtStatus: {}, customDebts: [], goals: state.goals } });
    }
    render();
  } catch (e) {
    renderSetup('Não consegui carregar seus dados. Detalhe técnico: ' + (e.message || e));
  }
}

async function saveData() {
  syncing = true;
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const { error } = await sb.from(TABLE).upsert({
        id: cfg.code,
        payload: { entries: state.entries, debtStatus: state.debtStatus, customDebts: state.customDebts, goals: state.goals, categoryBudgets: state.categoryBudgets, plannedBills: state.plannedBills, customCategories: state.customCategories },
        updated_at: new Date().toISOString()
      });
      if (!error) { syncing = false; return true; }
      console.error('Falha ao salvar (tentativa ' + (attempt+1) + ')', error);
    } catch (e) { console.error('Falha ao salvar (tentativa ' + (attempt+1) + ')', e); }
    if (attempt === 0) await new Promise(r => setTimeout(r, 600));
  }
  syncing = false;
  return false;
}

function entriesForMonth(m) { return state.entries.filter(e => e.month === m).sort((a,b) => a.date.localeCompare(b.date)); }
function sobraReal(m) { return entriesForMonth(m).reduce((sum, e) => sum + (e.type === 'in' ? e.valor : -e.valor), 0); }
function saldoAcumulado(m) {
  const idx = monthIndex(m);
  return MONTHS.slice(0, idx + 1).reduce((sum, mm) => sum + sobraReal(mm), 0);
}
function totalSavedFor(goalId) { return state.entries.filter(e => e.cat === 'Poupança' && e.goalId === goalId && e.type === 'out').reduce((sum, e) => sum + e.valor, 0); }
function sumIn(m) { return entriesForMonth(m).filter(e => e.type === 'in').reduce((s,e) => s + e.valor, 0); }
function sumDebtOut(m) { return entriesForMonth(m).filter(e => e.type === 'out' && e.cat === 'Dívida fixa').reduce((s,e) => s + e.valor, 0); }

function daysUntil(dueDay) {
  const now = new Date();
  let target = new Date(now.getFullYear(), now.getMonth(), dueDay);
  if (target < now) target = new Date(now.getFullYear(), now.getMonth() + 1, dueDay);
  return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
}

function pendingBillsForMonth(m) { return state.plannedBills.filter(b => b.month === m).sort((a,b) => (a.dueDay||99) - (b.dueDay||99)); }
function totalPendingForMonth(m) { return pendingBillsForMonth(m).reduce((s,b) => s + b.valor, 0); }

function categoryBreakdown(m) {
  const es = entriesForMonth(m).filter(e => e.type === 'out');
  const map = {};
  es.forEach(e => { map[e.cat] = (map[e.cat] || 0) + e.valor; });
  const total = Object.values(map).reduce((a,b) => a+b, 0);
  return Object.entries(map).sort((a,b) => b[1]-a[1]).map(([cat, val]) => ({ cat, val, pct: total ? (val/total*100) : 0 }));
}

function buildSummaryText() {
  const lines = [];
  lines.push('Resumo do Livro de Contas — ' + new Date().toLocaleDateString('pt-BR'));
  lines.push('');
  lines.push('Metas:');
  state.goals.forEach(g => lines.push('- ' + g.name + ': guardado ' + fmt(totalSavedFor(g.id)) + ' de ' + fmt(g.target) + (g.deadline ? ' (até ' + g.deadline + ')' : '')));
  lines.push('');
  const pendAll = pendingBillsForMonth(state.currentMonth);
  if (pendAll.length) {
    lines.push('Contas previstas ainda não pagas (' + MONTH_LABELS[state.currentMonth] + '):');
    pendAll.forEach(b => lines.push('- ' + b.name + ': ' + fmt(b.valor) + (b.dueDay ? ' (dia ' + b.dueDay + ')' : '')));
    lines.push('');
  }
  MONTHS.forEach(m => {
    const es = entriesForMonth(m);
    if (es.length === 0) return;
    lines.push('--- ' + MONTH_LABELS[m] + ' — sobra: ' + fmt(sobraReal(m)) + ' ---');
    es.forEach(e => lines.push((e.type === 'in' ? '+ ' : '- ') + fmt(e.valor) + ' | ' + e.cat + (e.nota ? ' | ' + e.nota : '')));
  });
  lines.push('');
  lines.push('Dívidas:');
  allDebts().forEach(d => {
    const checked = !!state.debtStatus[d.id];
    lines.push('- ' + d.name + ': ' + (d.kind === 'checkable' ? (checked ? 'quitado/resolvido' : 'pendente') : 'em andamento'));
  });
  return lines.join('\n');
}

    const e = state.entries.find(x => x.id === editingId);
    if (e) {
      document.getElementById('in-valor').value = e.valor;
      document.getElementById('in-data').value = e.date;
      document.getElementById('in-cat').value = e.cat;
      document.getElementById('in-nota').value = e.nota || '';
      if (e.cat === 'Poupança' && e.goalId) document.getElementById('in-goal').value = e.goalId;
    }
    document.getElementById('cancel-edit').addEventListener('click', () => { editingId = null; render(); });
  }
  syncGoalRow();

  document.getElementById('btn-add').addEventListener('click', async () => {
    const valorEl = document.getElementById('in-valor');
    const dataEl = document.getElementById('in-data');
    const catEl = document.getElementById('in-cat');
    const notaEl = document.getElementById('in-nota');
    const valor = parseFloat(valorEl.value);
    if (!valor || valor <= 0) { valorEl.style.borderColor = 'var(--rust)'; return; }
    const date = dataEl.value || new Date().toISOString().slice(0,10);
    const goalId = catEl.value === 'Poupança' ? document.getElementById('in-goal').value : undefined;

    let backup = null;
    if (editingId) {
      const idx = state.entries.findIndex(x => x.id === editingId);
      backup = { ...state.entries[idx] };
      state.entries[idx] = { ...backup, date, type: selType, cat: catEl.value, nota: notaEl.value.trim(), valor, goalId };
    } else {
      state.entries.push({ id: Date.now().toString(36), month: state.currentMonth, date, type: selType, cat: catEl.value, nota: notaEl.value.trim(), valor, goalId });
    }
    const wasEditing = editingId;
    editingId = null;
    render();
    const ok = await saveData();
    if (!ok) {
      if (wasEditing && backup) { const idx = state.entries.findIndex(x => x.id === backup.id); state.entries[idx] = backup; }
      else state.entries.pop();
      saveError = true;
    } else { saveError = false; }
    render();
  });

  document.querySelectorAll('.entry-edit').forEach(el => el.addEventListener('click', () => {
    editingId = el.dataset.id;
    const e = state.entries.find(x => x.id === editingId);
    if (e) selType = e.type;
    render();
    document.getElementById('in-valor').focus();
  }));

  document.querySelectorAll('.entry-del').forEach(el => el.addEventListener('click', async () => {
    const removed = state.entries.find(e => e.id === el.dataset.id);
    state.entries = state.entries.filter(e => e.id !== el.dataset.id);
    render();
    const ok = await saveData();
    if (!ok) { if (removed) state.entries.push(removed); saveError = true; } else { saveError = false; }
    render();
  }));

  document.querySelectorAll('[data-debt]').forEach(el => el.addEventListener('change', async () => {
    const prev = !!state.debtStatus[el.dataset.debt];
    state.debtStatus[el.dataset.debt] = el.checked;
    render();
    const ok = await saveData();
    if (!ok) { state.debtStatus[el.dataset.debt] = prev; saveError = true; } else { saveError = false; }
    render();
  }));

  document.querySelectorAll('[data-quick]').forEach(el => el.addEventListener('click', async () => {
    const d = allDebts().find(x => x.id === el.dataset.quick);
    const entry = { id: Date.now().toString(36), month: state.currentMonth, date: new Date().toISOString().slice(0,10), type: 'out', cat: d.quickCat, nota: d.name, valor: d.quickVal(state.currentMonth) };
    state.entries.push(entry);
    render();
    const ok = await saveData();
    if (!ok) { state.entries.pop(); saveError = true; } else { saveError = false; }
    render();
  }));

  document.getElementById('btn-new-bill-toggle').addEventListener('click', () => {
    const f = document.getElementById('new-bill-form');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  });

  document.getElementById('btn-new-bill-save').addEventListener('click', async () => {
    const nome = document.getElementById('nb-nome').value.trim();
    const valor = parseFloat(document.getElementById('nb-valor').value);
    const dia = parseInt(document.getElementById('nb-dia').value, 10);
    const cat = document.getElementById('nb-cat').value;
    if (!nome || !valor || valor <= 0) { alert('Preenche pelo menos o nome e o valor.'); return; }
    const bill = { id: 'bill-' + Date.now().toString(36), month: state.currentMonth, name: nome, valor, cat, dueDay: (dia >= 1 && dia <= 31) ? dia : undefined };
    state.plannedBills.push(bill);
    render();
    const ok = await saveData();
    if (!ok) { state.plannedBills.pop(); saveError = true; } else { saveError = false; }
    render();
  });

  document.querySelectorAll('[data-pay-bill]').forEach(el => el.addEventListener('click', async () => {
    const bill = state.plannedBills.find(b => b.id === el.dataset.payBill);
    if (!bill) return;
    const newEntry = { id: Date.now().toString(36), month: bill.month, date: new Date().toISOString().slice(0,10), type: 'out', cat: bill.cat, nota: bill.name, valor: bill.valor };
    state.entries.push(newEntry);
    state.plannedBills = state.plannedBills.filter(b => b.id !== bill.id);
    render();
    const ok = await saveData();
    if (!ok) { state.entries.pop(); state.plannedBills.push(bill); saveError = true; } else { saveError = false; }
    render();
  }));

  document.querySelectorAll('[data-del-bill]').forEach(el => el.addEventListener('click', async () => {
    const removed = state.plannedBills.find(b => b.id === el.dataset.delBill);
    state.plannedBills = state.plannedBills.filter(b => b.id !== el.dataset.delBill);
    render();
    const ok = await saveData();
    if (!ok) { if (removed) state.plannedBills.push(removed); saveError = true; } else { saveError = false; }
    render();
  }));

  document.querySelectorAll('[data-set-budget]').forEach(el => el.addEventListener('click', async () => {
    const cat = el.dataset.setBudget;
    const current = state.categoryBudgets[cat];
    const val = prompt('Orçamento mensal pra "' + cat + '" (deixe vazio pra remover):', current !== undefined ? current : '');
    if (val === null) return;
    const prevBudgets = { ...state.categoryBudgets };
    if (val.trim() === '') delete state.categoryBudgets[cat];
    else {
      const num = parseFloat(val.replace(',', '.'));
      if (!num || num <= 0) { alert('Valor inválido.'); return; }
      state.categoryBudgets[cat] = num;
    }
    render();
    const ok = await saveData();
    if (!ok) { state.categoryBudgets = prevBudgets; saveError = true; } else { saveError = false; }
    render();
  }));

  document.getElementById('btn-new-goal-toggle').addEventListener('click', () => {
    const f = document.getElementById('new-goal-form');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  });

  document.getElementById('btn-new-goal-save').addEventListener('click', async () => {
    const nome = document.getElementById('ng-nome').value.trim();
    const valor = parseFloat(document.getElementById('ng-valor').value);
    const prazo = document.getElementById('ng-prazo').value.trim();
    if (!nome || !valor || valor <= 0) { alert('Preenche pelo menos o nome e o valor alvo.'); return; }
    const newGoal = { id: 'goal-' + Date.now().toString(36), name: nome, target: valor, deadline: prazo || null };
    state.goals.push(newGoal);
    render();
    const ok = await saveData();
    if (!ok) { state.goals.pop(); saveError = true; } else { saveError = false; }
    render();
  });

  document.querySelectorAll('[data-goal-del]').forEach(el => el.addEventListener('click', async () => {
    if (!confirm('Remover essa meta? Os lançamentos ligados a ela continuam guardados, só param de contar pra nenhuma meta.')) return;
    const removed = state.goals.find(g => g.id === el.dataset.goalDel);
    state.goals = state.goals.filter(g => g.id !== el.dataset.goalDel);
    render();
    const ok = await saveData();
    if (!ok) { if (removed) state.goals.push(removed); saveError = true; } else { saveError = false; }
    render();
  }));

  document.getElementById('btn-new-debt-toggle').addEventListener('click', () => {
    const f = document.getElementById('new-debt-form');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  });

  document.getElementById('btn-new-debt-save').addEventListener('click', async () => {
    const nome = document.getElementById('nd-nome').value.trim();
    const valor = parseFloat(document.getElementById('nd-valor').value);
    const tipo = document.getElementById('nd-tipo').value;
    const dia = parseInt(document.getElementById('nd-dia').value, 10);
    if (!nome || !valor || valor <= 0) { alert('Preenche pelo menos o nome e o valor.'); return; }
    const newDebt = {
      id: 'custom-' + Date.now().toString(36),
      name: nome,
      valor,
      kind: tipo,
      meta: fmt(valor) + (tipo === 'ongoing' ? '/mês' : ' (quitação)') + (dia ? ' · vence dia ' + dia : ''),
      dueDay: (dia && dia >= 1 && dia <= 31) ? dia : undefined
    };
    state.customDebts.push(newDebt);
    render();
    const ok = await saveData();
    if (!ok) { state.customDebts.pop(); saveError = true; } else { saveError = false; }
    render();
  });

  document.querySelectorAll('[data-custom-del]').forEach(el => el.addEventListener('click', async () => {
    if (!confirm('Remover essa conta cadastrada?')) return;
    const removed = state.customDebts.find(d => d.id === el.dataset.customDel);
    state.customDebts = state.customDebts.filter(d => d.id !== el.dataset.customDel);
    render();
    const ok = await saveData();
    if (!ok) { if (removed) state.customDebts.push(removed); saveError = true; } else { saveError = false; }
    render();
  }));

  document.getElementById('btn-export-json').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ entries: state.entries, debtStatus: state.debtStatus, customDebts: state.customDebts, goals: state.goals, categoryBudgets: state.categoryBudgets, plannedBills: state.plannedBills, customCategories: state.customCategories }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'livro-de-contas-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
  });

  document.getElementById('btn-export-copy').addEventListener('click', async () => {
    const text = buildSummaryText();
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    copyConfirmVisible = true; render();
    setTimeout(() => { copyConfirmVisible = false; render(); }, 4000);
  });

  document.getElementById('reset-link').addEventListener('click', async () => {
    if (confirm('Apagar todos os lançamentos e status de dívidas? Isso não pode ser desfeito.')) {
      const prevEntries = state.entries, prevStatus = state.debtStatus, prevCustom = state.customDebts, prevBills = state.plannedBills;
      state.entries = []; state.debtStatus = {}; state.customDebts = []; state.plannedBills = [];
      render();
      const ok = await saveData();
      if (!ok) { state.entries = prevEntries; state.debtStatus = prevStatus; state.customDebts = prevCustom; state.plannedBills = prevBills; saveError = true; } else { saveError = false; }
      render();
    }
  });

  document.getElementById('switch-link').addEventListener('click', () => renderSetup());

  document.getElementById('pin-link').addEventListener('click', () => {
    const current = getPin();
    if (current) {
      if (confirm('Remover a proteção por PIN?')) { setPin(null); render(); }
    } else {
      const p = prompt('Cria uma senha/PIN (letras, números ou símbolos):');
      if (p && p.trim()) { setPin(p.trim()); render(); }
    }
  });
}

function formatDate(iso) { const [y,mo,d] = iso.split('-'); return `${d}/${mo}`; }

async function boot() {
  const pin = getPin();
  if (pin && !unlocked) { renderLock(); return; }
  cfg = loadConfig();
  if (cfg && cfg.url && cfg.key && cfg.code) {
    sb = window.supabase.createClient(cfg.url, cfg.key);
    await loadData();
  } else {
    renderSetup();
  }
}

boot();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
